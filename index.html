<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simmer</title>
<meta name="description" content="Healthy recipes for you and your dog, with step-by-step cook mode. Works offline.">
<meta name="theme-color" content="#1f3a2c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand"><span class="dot"></span>Simmer</div>
    <div class="seg" id="kind-seg" role="tablist" aria-label="Who is eating">
      <button data-kind="human">🧑 Human</button>
      <button data-kind="dog">🐶 Dog</button>
    </div>
  </header>

  <main id="view"></main>

  <nav class="tabs" aria-label="Sections">
    <button data-tab="recipes"><span>📖</span>Recipes</button>
    <button data-tab="saved"><span>★</span>Saved</button>
    <button data-tab="shop"><span>🛒</span>List</button>
    <button data-tab="guide"><span>💡</span>Guide</button>
  </nav>
</div>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-card" role="dialog" aria-modal="true">
    <button class="close" id="sheet-close" aria-label="Close">✕</button>
    <div id="sheet-body"></div>
  </div>
</div>

<div id="cook" class="cook" hidden></div>
<div id="toast" class="toast" hidden></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
